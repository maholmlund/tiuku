services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  app:
    image: ghcr.io/maholmlund/tiuku:latest
    environment:
      MONGODB_URI: mongodb://mongodb:27017/testdb
      TIUKU_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
